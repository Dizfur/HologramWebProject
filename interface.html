 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education for Renewable Energy</title>
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #a855f7, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Main Container */
        .container {
            background-color: #121212;
            color: white;
            width: 800px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: bold;
            background-color: #1f1f1f;
        }

        /* Energy Type Section */
        .energy-icons {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }

        .icon {
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            position: relative;
        }

        .icon img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #3b82f6;
        }

        .icon:hover {
            transform: scale(1.1);
        }

        /* Preview Section */
        .preview {
            background-color: #1f1f1f;
            height: 300px;
            margin: 0 20px;
            border-radius: 10px;
            padding: 15px;
            color: #bbbbbb;
            font-size: 16px;
            overflow-y: auto;
        }

        /* Last Played Video Section */
        .last-played {
            background-color: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            margin: 20px;
            color: #bbbbbb;
            font-size: 16px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .button:hover {
            background-color: #2563eb;
        }

        /* Mockup Modal for Report */
        #report-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">Renewable Energy</div>

        <!-- Energy Type Selection -->
        <div class="energy-icons">
            <div class="icon" onclick="showPreview('solar', 'solar.mp4')">
                <img src="images/solar.png" alt="Solar">
            </div>
            <div class="icon" onclick="showPreview('wind', 'wind.mp4')">
                <img src="images/wind.png" alt="Wind">
            </div>
            <div class="icon" onclick="showPreview('hydropower', 'hydropower.mp4')">
                <img src="images/water.png" alt="Hydropower">
            </div>
            <div class="icon" onclick="showPreview('geothermal', 'geothermal.mp4')">
                <img src="images/geothermal.jpg" alt="Geothermal">
            </div>
        </div>

        <!-- Preview Section -->
        <div class="preview" id="preview-box">
            <div class="default-preview"><p>Welcome to Hologram Projection Interface.</p><p>Select an energy type to preview details here.</p></div>
        </div>

        <!-- Button Group -->
        <div class="button-group">
            <button class="button" onclick="zoomInOut()">Zoom In/Out</button>		
            <button class="button" onclick="playAnimation()">Play Animation</button>
            <button class="button" onclick="generateReport()">Report</button>
        </div>
		
		<!-- Last Played Video Section -->
		<div class="last-played" id="last-played">
			<h3>Last Played Video:</h3>
			<p id="last-played-info">None</p> <!-- Default message if no video has been played -->
		</div>	
    </div>

    <!-- Mockup Modal for Report -->
    <div id="report-modal" style="display: none;">
        <div style="background: #1f1f1f; color: white; padding: 20px; border-radius: 10px; width: 400px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);">
            <h3 style="margin-top: 0;">Generate Report</h3>
            <p>Simulating the report generation process...</p>
            <ul>
                <li>Gathering data...</li>
                <li>Formatting report...</li>
                <li>Preparing download...</li>
            </ul>
            <div style="text-align: right; margin-top: 15px;">
                <button onclick="closeReportModal()" style="background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-right: 10px;">Close</button>
            </div>
        </div>
    </div>
	<script src="js/interface.js"></script> <!-- External JavaScript file -->
</body>
</html>
