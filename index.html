<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Video Player</title>
    <style>
        /* Video Container */
        .video-container {
            position: relative;
            width: 800px;
            height: 450px;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            background: #1f1f1f;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block; /* Ensure canvas takes full space */
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const videoSourceUrl = params.get('video');
        const playButton = document.getElementById('play-button');

        let scene, camera, renderer, video, videoTexture, videoMesh;
		let showBorders = true; // Toggle for border visibility
		
        // Initialize Three.js
        function init() {
            // Create the scene
            scene = new THREE.Scene();

            // Set up camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Set up renderer
			renderer = new THREE.WebGLRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

            // Create a video element
            video = document.createElement('video');
            video.crossOrigin = 'anonymous'; // Allow cross-origin video loading
            video.muted = true; // Mute the video if autoplaying in some browsers
			video.loop = false; // Disable loop for sequential playback
			video.controls = false;
			
            // Create video texture
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;

            // Create a plane geometry for video
			createHologramPlanes()
            
			// Start the render loop
            animate();
        }

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Function to play the video
        function playVideo() {
            if (videoSourceUrl) {
                video.src = videoSourceUrl; // Set video source from the URL parameter
                video.load(); // Load the video
                video.play().catch(error => {
                    console.error('Error attempting to play video:', error);
                });
            } else {
                console.error('No video selected.'); // Log an error if no video is provided
            }
        }

		function createHologramPlanes() {
			const planeGeometry = new THREE.PlaneGeometry(4, 2.25);
			const videoMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });

			const borderMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
			const edgesGeometry = new THREE.EdgesGeometry(planeGeometry);

			const createPlaneWithBorder = (position, rotation, scale) => {
				// Create the main plane
				const plane = new THREE.Mesh(planeGeometry, videoMaterial);
				plane.position.set(position.x, position.y, position.z);
				plane.rotation.set(rotation.x, rotation.y, rotation.z);
				plane.scale.set(scale.x, scale.y, scale.z);
				scene.add(plane);

				// Optionally add a border
				if (showBorders) {
					const border = new THREE.LineSegments(edgesGeometry, borderMaterial);
					border.position.copy(plane.position);
					border.rotation.copy(plane.rotation);
					border.scale.copy(plane.scale);
					scene.add(border);
				}
			};

			// Common scale value for planes
			const planeScale = { x: 0.64, y: 0.64, z: 0.2 };

			// Add planes with their positions, rotations, and scales
			// Top plane
			createPlaneWithBorder(
				{ x: 0, y: 2, z: 0 }, //position
				{ x: 0, y: 0, z: 0 }, //rotation
				planeScale //scale
			);
			// Bottom plane
			createPlaneWithBorder(
				{ x: 0, y: -2, z: 0 }, //position
				{ x: 0, y: 0, z: 0 }, //rotation
				{ x: -planeScale.x, y: -planeScale.y, z: planeScale.z }	//scale
			);
			// Left plane
			createPlaneWithBorder(
				{ x: -1.5, y: 0, z: 0 }, //position
				{ x: 0, y: 0, z: (3 * Math.PI) / 2 }, //rotation
				{ x: -planeScale.x, y: -planeScale.y, z: planeScale.z } //scale
			);
			// Right plane
			createPlaneWithBorder(
				{ x: 1.5, y: 0, z: 0 }, //position
				{ x: 0, y: 0, z: Math.PI / 2 }, //rotation
				{ x: -planeScale.x, y: -planeScale.y, z: planeScale.z } //scale
			);
		}

		function toggleBorders() {
			showBorders = !showBorders;
			scene.clear(); // Clear the scene
			createHologramPlanes(); // Recreate planes with updated border visibility
		}

        // WebSocket connection
        const ws = new WebSocket('ws://192.168.0.222:3000'); // Replace with your WebSocket server URL

        ws.onopen = () => {
            console.log('WebSocket connection established.');
        };

        ws.onmessage = (event) => {
            console.log('Received message:', event.data);

            // Check if the received message is of type 'string'
            if (typeof event.data === 'string') {
                try {
                    const message = JSON.parse(event.data);
                    if (message.action === 'play') {
                        // Update video source and play
                        const newVideoUrl = 'videos/' + message.video; // Assuming the message contains the video URL
                        console.log('New video URL:', newVideoUrl); // Log the new URL
                        video.src = newVideoUrl; // Update the video source
                        video.load(); // Load the new video
                        video.play().catch(error => {
                            console.error('Error attempting to play video:', error);
                        });
                    }
                } catch (error) {
                    console.error('Failed to parse message as JSON:', error);
                    alert('Received an invalid message from the server.'); // Alert the user
                }
            } else {
                console.error('Received unexpected data type:', typeof event.data);
            }
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        ws.onclose = () => {
            console.log('WebSocket connection closed.');
        };

        // Initialize the scene
        init();
    </script>
</body>
</html>
