<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hologram Video Player</title>
	
	<!-- Link to favicon -->
    <link rel="icon" href="ico/hologram.ico" type="image/x-icon">
    <style>
		body {
            margin: 0;
            overflow: hidden;
            background-color: black;
			perspective: 1000px; /* Perspective for 3D space */
			transform-style: preserve-3d; /* Allow 3D transformations for child elements */
        }
        .subtitle {
            position: absolute;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }
        #top-subtitle {
            top: 100px;
			transform: scaleX(-1);
        }
        #bottom-subtitle {
            bottom: 50px;
			transform: scaleY(-1);
        }
        #left-subtitle {
            left: 150px;
			top: 50%;
            transform: translateY(-50%) rotate(90deg) scaleX(-1);
        }
        #right-subtitle {
            right: 150px;
			top: 50%;
            transform: translateY(-50%) rotate(270deg) scaleX(-1) ;
        }
		
        canvas {
            width: 100%;
            height: 100%;
            display: block; /* Ensure canvas takes full space */
        }
		
        /* Center marker styles */
        #center-marker {
            position: absolute;
            top: 50%; /* Center vertically */
            left: 50%; /* Center horizontally */
            width: 100px; /* Width of the rectangle */
            height: 100px; /* Height of the rectangle */
            background-color: red; /* Color of the rectangle */
            transform: translate(-50%, -50%); /* Adjust position to be centered */
            z-index: 1001; /* Ensure it appears above other elements */
        }

        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: flex-end; /* Align items at the bottom */
            justify-content: center;
            z-index: 1000;
            padding-bottom: 50px; /* Add padding to position the button above the bottom */
        }
		
        #modal button {
            padding: 15px 30px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: #444;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
        }
		
        #modal button:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div id="modal">
        <button id="bypass-autoplay-restriction-button">Bypass Autoplay Restriction</button>
    </div>

    <div id="top-subtitle" class="subtitle"></div>
    <div id="bottom-subtitle" class="subtitle"></div>
    <div id="left-subtitle" class="subtitle"></div>
    <div id="right-subtitle" class="subtitle"></div>

    <!-- Center marker for hologram box -->
    <div id="center-marker"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/player.js"></script> <!-- External JavaScript file -->
</body>
</html>
